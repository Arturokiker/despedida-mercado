let db = null;
let appState = JSON.parse(localStorage.getItem('libreta_mercado_firestore')) || {};

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  document.getElementById('cloud-indicator').innerHTML = '<span style="color:#86efac">●</span> Firestore Conectado (En vivo)';

  // Escuchar cambios en Firestore en tiempo real
  db.collection("eventos").doc("despedida_mercado").onSnapshot((doc) => {
    if (doc.exists) {
      appState = doc.data();
      localStorage.setItem('libreta_mercado_firestore', JSON.stringify(appState));
      renderApp();
    }
  }, (error) => {
    console.warn("Modo local o permiso pendiente:", error);

// ==========================================
// 3. SINCRONIZACIÓN Y RENDER
// ==========================================
function syncData() {
  localStorage.setItem('libreta_mercado_firestore', JSON.stringify(appState));
  if (db) {
    db.collection("eventos").doc("despedida_mercado").set(appState, { merge: true })
      .then(() => showToast())
      .catch((err) => console.error("Error al guardar en Firestore:", err));
  } else {
    showToast();
  }
  updateMetrics();
}

function showToast() {
  const t = document.getElementById('toast');
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1000);
}

function updateMetrics() {
  let totalFam = FAMILIAS.length;
  let totalPeople = 0, contacted = 0, yes = 0, maybe = 0, no = 0;

  FAMILIAS.forEach(f => {
    f.miembros.forEach(m => {
      totalPeople++;
      const s = appState[m.id] || {};
      if (s.contacted) contacted++;
      if (s.status === 'yes') yes++;
      if (s.status === 'maybe') maybe++;
      if (s.status === 'no') no++;
    });
  });

  document.getElementById('st-fam').innerText = totalFam;
  document.getElementById('st-total').innerText = totalPeople;
  document.getElementById('st-contacted').innerText = contacted;
  document.getElementById('st-yes').innerText = yes;
  document.getElementById('st-maybe').innerText = maybe;
  document.getElementById('st-no').innerText = no;
}

function renderApp() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const grp = document.getElementById('filter-group').value;
  const mode = document.getElementById('view-mode').value;
  const mainDiv = document.getElementById('main-content');
  const visDiv = document.getElementById('visitors-content');
  mainDiv.innerHTML = '';
  visDiv.innerHTML = '';

  const filtered = FAMILIAS.filter(f => {
    const mGrp = (grp === 'ALL' || f.grupo === grp);
    const mSearch = f.nombre.toLowerCase().includes(q) || f.miembros.some(m => {
      const matchName = m.nombre.toLowerCase().includes(q);
      const matchPhone = m.telefonos && m.telefonos.some(t => t.num.includes(q));
      return matchName || matchPhone;
    });
    return mGrp && mSearch;
  });

  if (mode === 'GRUPOS') {
    const listGroups = ['Grupo 1', 'Grupo 2', 'Grupo 3', 'Grupo 4', 'Grupo 5', '-'];
    listGroups.forEach(gName => {
      const subList = filtered.filter(f => f.grupo === gName);
      if (subList.length > 0) {
        const title = document.createElement('div');
        title.className = 'section-title';
        title.innerText = `📌 ${gName} (${subList.length} familias)`;
        mainDiv.appendChild(title);
        subList.forEach(f => mainDiv.appendChild(createCard(f, q)));
      }
    });
  } else {
    filtered.forEach(f => mainDiv.appendChild(createCard(f, q)));
  }

  const filteredVis = VISITANTES.filter(f => {
    return f.nombre.toLowerCase().includes(q) || f.miembros.some(m => {
      return m.nombre.toLowerCase().includes(q) || (m.telefonos && m.telefonos.some(t => t.num.includes(q)));
    });
  });
  filteredVis.forEach(f => visDiv.appendChild(createCard(f, q, true)));

  updateMetrics();
}

function createCard(fam, q, isVisitor = false) {
  const card = document.createElement('div');
  const allChecked = fam.miembros.every(m => (appState[m.id] && appState[m.id].contacted));
  card.className = `family-card ${allChecked ? 'completed' : ''}`;

  const head = document.createElement('div');
  head.className = 'family-head';
  head.innerHTML = `
    <div class="family-name">
      ${isVisitor ? '👤' : '🏠'} Familia ${fam.nombre}
      <span class="badge badge-g">${fam.grupo}</span>
      <span class="badge">${fam.miembros.length} ${fam.miembros.length === 1 ? 'persona' : 'personas'}</span>
    </div>
    <div>
      <button class="btn-fam-toggle" onclick="toggleFamily('${fam.id}', ${!allChecked}, ${isVisitor})">
        ${allChecked ? 'Desmarcar familia' : '✓ Avisar a todos'}
      </button>
    </div>
  `;
  card.appendChild(head);

  const list = document.createElement('div');
  list.className = 'member-list';

  fam.miembros.forEach(m => {
    if (q) {
      const matchName = m.nombre.toLowerCase().includes(q) || fam.nombre.toLowerCase().includes(q);
      const matchPhone = m.telefonos && m.telefonos.some(t => t.num.includes(q));
      if (!matchName && !matchPhone) return;
    }

    const s = appState[m.id] || { contacted: false, status: 'pending', note: '' };
    const row = document.createElement('div');
    row.className = `member-row ${s.contacted ? 'is-contacted' : ''}`;

    let phonesHtml = '';
    if (m.telefonos && m.telefonos.length > 0) {
      phonesHtml = '<div class="phones-container">';
      m.telefonos.forEach(t => {
        const clean = t.num.replace(/\D/g, '');
        const waLink = clean ? `https://wa.me/57${clean.slice(-10)}` : '#';
        const telLink = clean ? `tel:${clean}` : '#';
        const isPri = t.tipo === 'Principal';

        phonesHtml += `
          <div class="phone-item">
            <span class="phone-tag ${isPri ? 'primary' : 'alt'}">${isPri ? '★ ' + t.tipo : '↳ ' + t.tipo}</span>
            <span class="phone-number">${t.num}</span>
            <small style="color:var(--text-muted); font-size:0.7rem;">(${t.nota})</small>
            ${clean ? `
              <a href="${telLink}" class="btn-icon btn-call" title="Llamar a ${t.num}">📞</a>
              <a href="${waLink}" target="_blank" class="btn-icon btn-wapp" title="WhatsApp a ${t.num}">💬</a>
            ` : ''}
          </div>
        `;
      });
      phonesHtml += '</div>';
    } else {
      phonesHtml = '<span style="font-size:0.75rem; color:var(--text-muted);">Sin teléfono registrado</span>';
    }

    row.innerHTML = `
      <div>
        <input type="checkbox" ${s.contacted ? 'checked' : ''} onchange="togglePerson('${m.id}', this.checked)" title="Marcar como avisado">
      </div>
      <div>
        <div class="member-name">${m.nombre}</div>
        <div class="member-sub">${m.parentesco} • <b>${m.rol}</b></div>
      </div>
      <div>${phonesHtml}</div>
      <div class="actions-box">
        <select class="status-select" onchange="setStatus('${m.id}', this.value)">
          <option value="pending" ${s.status === 'pending' ? 'selected' : ''}>⏳ Pendiente</option>
          <option value="yes" ${s.status === 'yes' ? 'selected' : ''}>✅ Asiste</option>
          <option value="maybe" ${s.status === 'maybe' ? 'selected' : ''}>🤔 En duda</option>
          <option value="no" ${s.status === 'no' ? 'selected' : ''}>❌ No va</option>
        </select>
        <input type="text" class="note-input" placeholder="Aporte / detalle..." value="${s.note || ''}" onchange="setNote('${m.id}', this.value)">
      </div>
    `;
    list.appendChild(row);
  });

  card.appendChild(list);
  return card;
}

function togglePerson(id, val) {
  if (!appState[id]) appState[id] = { status: 'pending', note: '' };
  appState[id].contacted = val;
  syncData();
  renderApp();
}

function toggleFamily(fId, val, isVisitor) {
  const source = isVisitor ? VISITANTES : FAMILIAS;
  const fam = source.find(f => f.id === fId);
  if (!fam) return;
  fam.miembros.forEach(m => {
    if (!appState[m.id]) appState[m.id] = { status: 'pending', note: '' };
    appState[m.id].contacted = val;
  });
  syncData();
  renderApp();
}

function setStatus(id, val) {
  if (!appState[id]) appState[id] = { contacted: false, note: '' };
  appState[id].status = val;
  if (val !== 'pending') appState[id].contacted = true;
  syncData();
  renderApp();
}

function setNote(id, val) {
  if (!appState[id]) appState[id] = { contacted: false, status: 'pending' };
  appState[id].note = val;
  syncData();
}

function copyWhatsAppSummary() {
  let yesList = [];
  let maybeList = [];
  let confirmedPeople = 0;

  FAMILIAS.forEach(f => {
    f.miembros.forEach(m => {
      const s = appState[m.id] || {};
      if (s.status === 'yes') {
        confirmedPeople++;
        const noteStr = s.note ? ` (${s.note})` : '';
        yesList.push(`• ${m.nombre} [Fam. ${f.nombre}]${noteStr}`);
      } else if (s.status === 'maybe') {
        maybeList.push(`• ${m.nombre} [Fam. ${f.nombre}]`);
      }
    });
  });

  let txt = `*REPORTE DESPEDIDA - HNO. WILLIAM MERCADO Y ESPOSA*\n\n`;
  txt += `✅ *Confirmados que asisten:* ${confirmedPeople}\n\n`;
  txt += `*Listado de Asistentes:*\n` + (yesList.length ? yesList.join('\n') : 'Ninguno aún') + `\n\n`;
  if (maybeList.length > 0) {
    txt += `🤔 *Por confirmar (${maybeList.length}):*\n` + maybeList.join('\n');
  }

  navigator.clipboard.writeText(txt).then(() => {
    alert("¡Resumen copiado para WhatsApp al portapapeles!");
  });
}

renderApp();
